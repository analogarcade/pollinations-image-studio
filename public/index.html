<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas — Image Studio</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/overrides.css"></head><body><main><header><div><p class="eyebrow">LOCAL IMAGE STUDIO</p><h1>Canvas<span> / </span>AI</h1><p class="intro">A quiet space for turning ideas into images.</p></div><div class="status"><i></i>Ready</div></header><div class="workspace"><aside><section class="composer"><label for="prompt">Describe an image <button id="idea" class="idea-refresh">New idea ↻</button><kbd>⌘ ↵</kbd></label><textarea id="prompt" rows="5" placeholder="A quiet Japanese garden at blue hour, cinematic photography..." autofocus></textarea><div class="controls"><button id="generate" class="generate">Generate <span>↗</span></button></div></section><section class="history"><div class="output-head"><span>Recent prompts</span><button id="clear" class="clear">Clear</button></div><div id="history-list" class="history-list"></div></section></aside><section class="output"><div class="output-head"><span>Latest generation</span><span id="meta">No image yet</span></div><div id="canvas" class="canvas"><div class="placeholder"><div class="mark">✦</div><p>Choose an idea or write your own prompt</p></div></div><div id="actions" class="image-actions" hidden><button id="download">Download image</button><button id="copy">Copy image link</button></div></section></div></main><script src="/app.js"></script></body></html>
